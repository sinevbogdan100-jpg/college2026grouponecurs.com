name: Android shell

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "android-shell/**"
      - ".github/workflows/android-shell.yml"

jobs:
  build-debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-shell

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sbp-information-android-debug
          path: android-shell/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
